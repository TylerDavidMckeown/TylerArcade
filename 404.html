<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Play Game - TylerArcade</title>
  <style>
    :root{--bg:#0a0a0a;--panel:#151515;--border:#333;--text:#f0f0f0;--muted:#999;--accent:#00ff88}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{display:flex;flex-direction:column}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#111;border-bottom:2px solid var(--accent)}
    .brand{color:var(--text);font-size:24px;font-weight:800;text-decoration:none}.brand span{color:var(--accent)}
    .back{color:var(--muted);text-decoration:none}.back:hover{color:var(--accent)}
    main{width:100%;max-width:1400px;margin:0 auto;padding:16px}
    .title{margin:0 0 12px;font-size:24px}
    .game-wrap{position:relative;width:100%;min-height:70vh;background:#000;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    iframe{display:block;width:100%;height:calc(100vh - 150px);min-height:600px;border:0;background:#000}
    .status{padding:60px 20px;text-align:center;color:var(--muted)}
    .status strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
    @media(max-width:700px){header{padding:0 14px}.brand{font-size:20px}main{padding:10px}.title{font-size:20px}iframe{height:calc(100vh - 125px);min-height:520px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Tyler<span>Arcade</span></a>
    <a class="back" href="/">← Back to games</a>
  </header>
  <main>
    <h1 class="title" id="gameTitle">Loading game…</h1>
    <div class="game-wrap" id="gameWrap">
      <div class="status"><strong>Loading…</strong>Connecting to the game.</div>
    </div>
  </main>
  <script>
    (function(){
      var path=window.location.pathname.replace(/\/+$/,'');
      var match=path.match(/^\/play\/([^/]+)$/i);
      var slug=match?decodeURIComponent(match[1]):'';
      var title=slug?slug.replace(/[-_]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}):'Game not found';
      var titleEl=document.getElementById('gameTitle');
      var wrap=document.getElementById('gameWrap');
      titleEl.textContent=slug?title:'Page not found';
      if(!slug){wrap.innerHTML='<div class="status"><strong>Page not found</strong><a href="/" style="color:#00ff88">Return to TylerArcade</a></div>';return;}
      var iframe=document.createElement('iframe');
      iframe.src='https://idev.games/embed/'+encodeURIComponent(slug);
      iframe.title=title+' — TylerArcade';
      iframe.allow='autoplay; fullscreen; gamepad; microphone; camera; clipboard-read; clipboard-write';
      iframe.allowFullscreen=true;
      iframe.loading='eager';
      wrap.replaceChildren(iframe);
      document.title=title+' - TylerArcade';
    })();
  </script>
</body>
</html>
